# Website + PostgreSQL on one cloud server. Copy .env.example to .env, fill it in, then:
#   docker compose up -d --build
# For HTTPS, run deploy/cloud/install.sh (Caddy in front) or put your cloud's load balancer in front.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: smm
      POSTGRES_USER: smm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm -d smm"]
      interval: 10s
      retries: 10

  app:
    build:
      context: .
      args:
        DB_DRIVERS: pg
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://smm:${POSTGRES_PASSWORD}@db:5432/smm
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
